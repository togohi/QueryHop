<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SnipSearch Options</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="mb-4">SnipSearch – Search Engines</h1>

        <!-- Add Engine Inline Form -->
        <form id="add-form" class="row g-2 align-items-center mb-3">
            <div class="col-md-3">
                <input id="name" class="form-control" placeholder="Engine name" required />
            </div>
            <div class="col-md-7">
                <input id="url" class="form-control" placeholder="Search URL (use {{query}})" required />
            </div>
            <div class="col-md-2 text-end d-flex gap-2 justify-content-end">
                <button id="cancel" type="button" class="btn btn-secondary d-none">
                <i class="fa fa-times"></i> Cancel
                </button>
                <button id="add" type="submit" class="btn btn-success">
                <i class="fa fa-plus"></i> Add
                </button>
            </div>
        </form>

        <!-- Engine List Table -->
        <table class="table table-bordered table-hover align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th style="width: 28px"></th>
                <th style="width: 20%">
                    Name
                    <button id="sort-name" type="button" class="btn btn-sm btn-link p-0 ms-1 text-secondary">
                        <i id="sort-icon" class="fa fa-sort"></i>
                    </button>
                </th>
                <th>URL</th>
                <th style="width: 90px">Actions</th>
            </tr>
            </thead>
            <tbody id="engine-list"></tbody>
            <tfoot>
                <tr>
                <td colspan="4" class="text-end py-2">
                    <button id="export" class="btn btn-outline-secondary btn-sm me-2">
                    <i class="fa fa-download"></i> Export
                    </button>
                    <label class="btn btn-outline-secondary btn-sm mb-0">
                    <i class="fa fa-upload"></i> Import
                    <input type="file" id="import" hidden>
                    </label>
                </td>
                </tr>
            </tfoot>
        </table>

        <!-- Footer Support Section -->
        <div class="mt-5 text-center border-top pt-4">
            <p class="mb-2">Support <strong>SnipSearch</strong> ❤️</p>
            <a href='https://ko-fi.com/Q5Q61FK1CC' target='_blank'><img height='36' style='border:0px;height:36px;' src='https://storage.ko-fi.com/cdn/kofi6.png?v=6' border='0' alt='Buy Me a Coffee at ko-fi.com' /></a>
        </div>
    </div>
    <script src="options.js"></script>
</body>
</html>
